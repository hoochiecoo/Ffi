name: Flutter Plugin FFI Build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-plugin-example:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Download and Setup OpenCV Android SDK
        run: |
          echo "Downloading OpenCV 4.12.0..."
          wget -q https://github.com/opencv/opencv/releases/download/4.12.0/opencv-4.12.0-android-sdk.zip
          unzip -q opencv-4.12.0-android-sdk.zip
          mv OpenCV-android-sdk opencv-sdk
          echo "OPENCV_ANDROID_SDK=$PWD/opencv-sdk" >> $GITHUB_ENV

      - name: Create FFI plugin
        run: |
          flutter create \
            --template=plugin_ffi \
            --platforms=android,ios \
            opencv_native

      - name: Convert to C++ and Call OpenCV
        run: |
          mv opencv_native/src/opencv_native.c opencv_native/src/opencv_native.cpp
          
          # Добавляем функцию get_opencv_version_major
          cat <<EOF > opencv_native/src/opencv_native.cpp
          #include <stdint.h>
          #include <opencv2/core.hpp> 

          #if defined(_WIN32)
          #define DART_EXPORT __declspec(dllexport)
          #else
          #define DART_EXPORT __attribute__((visibility("default"))) __attribute__((used))
          #endif

          extern "C" DART_EXPORT intptr_t sum(intptr_t a, intptr_t b) {
              return a + b;
          }

          extern "C" DART_EXPORT intptr_t get_opencv_version_major() {
              return CV_MAJOR_VERSION;
          }
          EOF

      - name: Configure CMakeLists.txt
        run: |
          CMAKE_FILE="opencv_native/src/CMakeLists.txt"
          sed -i 's/opencv_native.c/opencv_native.cpp/g' $CMAKE_FILE
          sed -i 's/LANGUAGES C/LANGUAGES CXX/g' $CMAKE_FILE
          
          cat <<EOF >> $CMAKE_FILE
          if (ANDROID)
              set(OpenCV_DIR "$OPENCV_ANDROID_SDK/sdk/native/jni")
              find_package(OpenCV REQUIRED)
              target_link_libraries(opencv_native \${OpenCV_LIBS})
          endif()
          EOF

      - name: Configure build.gradle for jniLibs
        run: |
          GRADLE_FILE="opencv_native/android/build.gradle"
          sed -i '/defaultConfig {/a \        externalNativeBuild {\n            cmake {\n                cppFlags "-std=c++11 -frtti -fexceptions"\n                arguments "-DANDROID_STL=c++_shared"\n            }\n        }' $GRADLE_FILE
          echo "
          android {
              sourceSets {
                  main {
                      jniLibs.srcDirs = [\"$OPENCV_ANDROID_SDK/sdk/native/libs\"]
                  }
              }
          }
          " >> $GRADLE_FILE

      - name: Build example APK
        run: |
          cd opencv_native/example
          flutter pub get
          flutter build apk --release

      # --- НОВЫЙ ШАГ: ПРОВЕРКА ЗАВИСИМОСТЕЙ ---
      - name: Verify OpenCV Linking (Mini Output)
        run: |
          APK_PATH="opencv_native/example/build/app/outputs/flutter-apk/app-release.apk"
          
          # Создаем временную папку и распаковываем туда APK
          mkdir -p apk_content
          unzip -q $APK_PATH -d apk_content
          
          echo "Checking dependencies of libopencv_native.so..."
          
          # Ищем нашу скомпилированную библиотеку (обычно в lib/arm64-v8a/)
          LIB_PATH=$(find apk_content -name "libopencv_native.so" | head -n 1)
          
          if [ -z "$LIB_PATH" ]; then
            echo "::error::File libopencv_native.so NOT found inside APK!"
            exit 1
          fi
          
          # readelf -d показывает динамические зависимости
          # Мы ищем строчку "NEEDED" и "libopencv_java4.so"
          DEPENDENCIES=$(readelf -d $LIB_PATH)
          
          echo "$DEPENDENCIES"
          
          if echo "$DEPENDENCIES" | grep -q "libopencv_java4.so"; then
             echo "✅ SUCCESS: Your plugin is successfully linked against OpenCV!"
             echo "Found dependency: libopencv_java4.so"
          else
             echo "❌ FAIL: OpenCV library dependency missing!"
             exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencv_native-example-apk
          path: opencv_native/example/build/app/outputs/flutter-apk/app-release.apk
