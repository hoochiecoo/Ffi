name: Flutter Plugin FFI Build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-plugin-example:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Create FFI plugin
        run: |
          flutter create \
            --template=plugin_ffi \
            --platforms=android,ios \
            opencv_native

      - name: Build example APK
        run: |
          cd opencv_native/example
          flutter pub get
          flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencv_native-example-apk
          path: opencv_native/example/build/app/outputs/flutter-apk/app-release.apk
